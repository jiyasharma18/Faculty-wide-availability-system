<!DOCTYPE html>
<html>
<head>
    <title>Faculty Panel</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- HEADER -->
<div class="header">
    <img src="/static/logo.png" class="logo">
    <h1>Faculty Status Update</h1>
</div>

<!-- MAIN CONTAINER -->
<div class="container">

<form method="POST" action="/update">

    <label><b>Select Faculty:</b></label><br><br>

    <select name="id" required>
        {% for f in faculty %}
            <option value="{{ f[0] }}">{{ f[1] }}</option>
        {% endfor %}
    </select>

    <br><br>

    <!-- STATUS BUTTONS -->
    <button type="submit" name="status" value="Present" class="btn">
        I am in Cabin
    </button>

    <button type="submit" name="status" value="Not Present" class="btn">
        I Left
    </button>

</form>

<br><br>

<!-- EXTRA BUTTONS -->
<a href="/add" class="btn">Register New Faculty</a>
<a href="/" class="btn">Back to Home</a>

</div>

</body>
</html>
