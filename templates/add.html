<!DOCTYPE html>
<html>
<head>
    <title>Add Faculty</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="header">
    <h1>Register New Faculty</h1>
</div>

<div class="container">

<form method="POST" action="/add_faculty">

    <input type="text" name="name" placeholder="Faculty Name" required><br><br>

    <input type="text" name="department" placeholder="Department" required><br><br>

    <input type="text" name="cabin" placeholder="Cabin Number" required><br><br>

    <button type="submit" class="btn">Add Faculty</button>

</form>

<br><br>

<a href="/" class="btn">Back to Home</a>

</div>

</body>
</html>
